# ==========================================================================
# GitHub Actions — Auto-deploy to GitHub Pages on push to main
# ==========================================================================

name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (for any build tools if needed)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Validate HTML
        run: |
          # Basic HTML validation - check for unclosed tags, etc.
          if command -v tidy >/dev/null 2>&1; then
            tidy -q -e index.html || true
          else
            echo "HTML Tidy not installed, skipping validation"
          fi

      - name: Check required files exist
        run: |
          required_files=(
            "index.html"
            "404.html"
            "robots.txt"
            "sitemap.xml"
            "assets/css/style.css"
            "assets/js/main.js"
            "assets/js/data.js"
            "assets/js/matrix.js"
            "assets/js/terminal.js"
          )
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing required file: $file"
              exit 1
            fi
            echo "✅ Found: $file"
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          # Exclude non-deploy files
          glob: |
            **/*
            !.github/**
            !scripts/**
            !components/**
            !.git/**
            !.claude/**
            !.agents/**
            !portfolio-react/**
            !skills-lock.json
            !*.md
            !LICENSE
            !README.md

  # Deploy job
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployment
        run: |
          echo "🚀 Deployment complete!"
          echo "📄 Site URL: ${{ steps.deployment.outputs.page_url }}"
          echo "⏱️  Deployed at: $(date -u)"